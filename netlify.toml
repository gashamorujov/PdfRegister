[build]
  publish = "public"
  command = "npm run check"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["express", "sharp"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/files/*"
  to = "/.netlify/functions/api/files/:splat"
  status = 200
  force = true
