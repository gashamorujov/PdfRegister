# fly launch --copy-config  (app adını özünüzə uyğun dəyişin)
app = "docflow"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  STORAGE_DIR = "/data/storage"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "docflow_data"
  destination = "/data/storage"
