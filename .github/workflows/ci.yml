name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Repository-ni götür
        uses: actions/checkout@v4
      - name: Node.js qur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dependencies quraşdır
        run: npm ci
      - name: Syntax yoxlaması
        run: npm run check
      - name: Testlər
        run: npm test
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
